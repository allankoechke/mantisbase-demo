services:
  mantisbase:
    build: .
    image: mantisbase-demo
    restart: always
    ports:
      - "7088:8080"
    volumes:
      # Optional: override default DB with host ./db (else image /mb/data-default is used)
      - ./db/data:/db-default:ro
      - ./scripts/docker-entrypoint.sh:/entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    environment:
      - MB_JWT_SECRET=${MB_JWT_SECRET}
      - MB_DISABLE_FILE_UPLOADS=true
      - MB_OAUTH_ENCRYPTION_KEY=${MB_OAUTH_ENCRYPTION_KEY}
      - MB_REALTIME_SSE_KEY=${MB_REALTIME_SSE_KEY}
      - MB_DISABLE_ADMIN_MUTATIONS=${MB_DISABLE_ADMIN_MUTATIONS}
      - MB_DISABLE_CONFIG_MUTATIONS=${MB_DISABLE_CONFIG_MUTATIONS}
      - MB_DISABLE_ADMIN_ON_FIRST_BOOT=${MB_DISABLE_ADMIN_ON_FIRST_BOOT}
      - MB_DISABLE_RATE_LIMIT=${MB_DISABLE_RATE_LIMIT}
      - MB_LOG_LEVEL=${MB_LOG_LEVEL}
      - MB_DATABASE_TYPE=${MB_DATABASE_TYPE}
      - MB_DATABASE_URL=${MB_DATABASE_URL}
      - MB_SKIP_ADMIN_SETUP=${MB_SKIP_ADMIN_SETUP}
      - MB_DEFAULT_ADMIN_EMAIL=${MB_DEFAULT_ADMIN_EMAIL}
      - MB_DEFAULT_ADMIN_PASSWORD=${MB_DEFAULT_ADMIN_PASSWORD}
      - MB_TRUSTED_PROXIES=${MB_TRUSTED_PROXIES}
      - MB_DISABLE_REALTIME_SSE=${MB_DISABLE_REALTIME_SSE}
      - MB_DISABLE_REALTIME_WS=${MB_DISABLE_REALTIME_WS}
      - MB_CORS_ORIGINS=${MB_CORS_ORIGINS}
